  </defs>

  <g clip-path="url(#frame)">
    <rect width="128" height="128" fill="url(#night)"/>
    <rect width="128" height="128" fill="url(#skyGlow)"/>
    <rect width="128" height="128" fill="url(#horizonGlow)"/>

    <!-- Vela perimeter starfield and subtle constellation arc clear of the central mark -->
    <g stroke="#7B93FF" stroke-width="0.28" stroke-dasharray="1.1 1.6" opacity="0.28">
      <path d="M16 20L31 15L50 14"/>
      <path d="M111 32L117 56L113 84"/>
