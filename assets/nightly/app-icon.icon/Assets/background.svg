    <g fill="#E4EAFF">
      <circle cx="16" cy="20" r="0.65" fill-opacity="0.86"/>
      <circle cx="31" cy="15" r="0.45" fill-opacity="0.72"/>
      <circle cx="50" cy="14" r="0.55" fill-opacity="0.78"/>
      <circle cx="111" cy="32" r="0.5" fill-opacity="0.74"/>
      <circle cx="117" cy="56" r="0.55" fill-opacity="0.76"/>
      <circle cx="113" cy="84" r="0.45" fill-opacity="0.68"/>
      <circle cx="11" cy="70" r="0.4" fill-opacity="0.58"/>
      <circle cx="19" cy="103" r="0.45" fill-opacity="0.6"/>
    </g>
    <path d="M64 13V16.6M62.2 14.8H65.8" stroke="#EEF2FF" stroke-width="0.5" stroke-linecap="round" opacity="0.72"/>
